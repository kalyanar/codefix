[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codefix"
version = "0.0.1"
description = "Verified, learned, transferable cross-function security-repair memory (v2)"
authors = [
    { name = "Gopal Krishnan" },
    { name = "Vijay K. Madisetti" },
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codefix = "codefix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
